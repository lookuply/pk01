services:
  pk01:
    build: .
    container_name: pk01
    restart: unless-stopped
    ports:
      - "4027:4027"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4027/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
